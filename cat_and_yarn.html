<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫玩毛线团</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            position: relative;
        }
        
        .scene {
            width: 400px;
            height: 300px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            border: 2px solid #ddd;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        .cat {
            position: absolute;
            bottom: 50px;
            left: 50px;
            z-index: 10;
            transform-origin: center bottom;
        }
        
        .cat-body {
            width: 60px;
            height: 40px;
            background: #FFA500;
            border-radius: 50%;
            position: relative;
        }
        
        .cat-head {
            width: 50px;
            height: 45px;
            background: #FFA500;
            border-radius: 50%;
            position: absolute;
            top: -30px;
            left: 5px;
        }
        
        .cat-ear {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 15px solid #FFA500;
            position: absolute;
            top: -5px;
        }
        
        .cat-ear.left {
            left: 5px;
            transform: rotate(-20deg);
        }
        
        .cat-ear.right {
            right: 5px;
            transform: rotate(20deg);
        }
        
        .cat-eye {
            width: 8px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            position: absolute;
            top: 15px;
        }
        
        .cat-eye.left {
            left: 15px;
        }
        
        .cat-eye.right {
            right: 15px;
        }
        
        .cat-nose {
            width: 8px;
            height: 5px;
            background: #FF69B4;
            border-radius: 50%;
            position: absolute;
            top: 25px;
            left: 21px;
        }
        
        .cat-mouth {
            width: 10px;
            height: 5px;
            border-bottom: 2px solid #333;
            border-radius: 0 0 50% 50%;
            position: absolute;
            top: 30px;
            left: 20px;
        }
        
        .cat-paw {
            width: 15px;
            height: 10px;
            background: #FFA500;
            border-radius: 50%;
            position: absolute;
            bottom: -5px;
        }
        
        .cat-paw.front-left {
            left: 10px;
        }
        
        .cat-paw.front-right {
            right: 10px;
        }
        
        .yarn {
            position: absolute;
            bottom: 50px;
            right: 80px;
            z-index: 5;
        }
        
        .yarn-ball {
            width: 40px;
            height: 40px;
            background: #FF69B4;
            border-radius: 50%;
            position: relative;
            animation: roll 4s infinite linear;
        }
        
        .yarn-string {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 3px;
            height: 100px;
            background: #FF69B4;
            transform-origin: top;
            animation: swing 3s infinite ease-in-out;
        }
        
        @keyframes roll {
            0% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(50px) rotate(180deg); }
            50% { transform: translateX(100px) rotate(360deg); }
            75% { transform: translateX(50px) rotate(540deg); }
            100% { transform: translateX(0) rotate(720deg); }
        }
        
        @keyframes swing {
            0% { transform: rotate(-10deg); }
            50% { transform: rotate(10deg); }
            100% { transform: rotate(-10deg); }
        }
        
        @keyframes nod {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(5deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-5deg); }
            100% { transform: rotate(0deg); }
        }
        
        .cat-head {
            animation: nod 2s infinite ease-in-out;
        }
        
        .grass {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(to top, #2E8B57, #3CB371);
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .controls {
            margin-top: 20px;
        }
        
        button {
            padding: 10px 20px;
            margin: 0 10px;
            border: none;
            border-radius: 5px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }
        
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>小猫玩毛线团</h1>
        <div class="scene">
            <div class="cat">
                <div class="cat-body">
                    <div class="cat-head">
                        <div class="cat-ear left"></div>
                        <div class="cat-ear right"></div>
                        <div class="cat-eye left"></div>
                        <div class="cat-eye right"></div>
                        <div class="cat-nose"></div>
                        <div class="cat-mouth"></div>
                    </div>
                    <div class="cat-paw front-left"></div>
                    <div class="cat-paw front-right"></div>
                </div>
            </div>
            <div class="yarn">
                <div class="yarn-string"></div>
                <div class="yarn-ball"></div>
            </div>
            <div class="grass"></div>
        </div>
        <div class="controls">
            <button onclick="speedUp()">加速</button>
            <button onclick="slowDown()">减速</button>
        </div>
    </div>

    <script>
        let speed = 1;
        
        function speedUp() {
            speed = Math.min(speed + 0.2, 3);
            updateAnimationSpeed();
        }
        
        function slowDown() {
            speed = Math.max(speed - 0.2, 0.5);
            updateAnimationSpeed();
        }
        
        function updateAnimationSpeed() {
            const rollAnimation = document.querySelector('.yarn-ball').getAnimations 
                ? document.querySelector('.yarn-ball').getAnimations()[0] 
                : null;
                
            if (rollAnimation) {
                rollAnimation.playbackRate = speed;
            } else {
                // Fallback:重新设置动画
                document.querySelector('.yarn-ball').style.animation = `roll ${4/speed}s infinite linear`;
                document.querySelector('.yarn-string').style.animation = `swing ${3/speed}s infinite ease-in-out`;
                document.querySelector('.cat-head').style.animation = `nod ${2/speed}s infinite ease-in-out`;
            }
        }
    </script>
</body>
</html>
