<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开心消消乐</title>
    <link rel="stylesheet" href="happy_crush.css">
</head>
<body>
    <div class="game-container">
        <h1>开心消消乐</h1>
        <div class="game-info">
            <div class="score">得分: <span id="score">0</span></div>
            <div class="moves">步数: <span id="moves">30</span></div>
        </div>
        <div class="game-board" id="gameBoard"></div>
        <div class="game-controls">
            <button id="restartBtn">重新开始</button>
        </div>
        <div class="game-instructions">
            <h3>游戏规则：</h3>
            <p>1. 点击一个糖果，然后点击相邻的糖果来交换位置</p>
            <p>2. 连接3个或更多相同颜色的糖果来消除它们</p>
            <p>3. 每次匹配都会获得分数，匹配越多分数越高</p>
            <p>4. 使用完所有步数后游戏结束</p>
        </div>
    </div>
    <script src="happy_crush.js"></script>
</body>
</html>
