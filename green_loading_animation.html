<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绿色加载动画</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .loading-container {
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            position: relative;
        }

        .spinner div {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 6px solid transparent;
            border-top-color: #4CAF50; /* 绿色 */
            border-radius: 50%;
            animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
        }

        .spinner div:nth-child(1) {
            animation-delay: -0.45s;
        }

        .spinner div:nth-child(2) {
            animation-delay: -0.3s;
        }

        .spinner div:nth-child(3) {
            animation-delay: -0.15s;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.6;
            }
        }

        /* 另一种加载动画选项：脉冲圆点 */
        .pulse-loader {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            margin: 0 5px;
            background-color: #4CAF50;
            border-radius: 50%;
            animation: pulse-dot 1.4s infinite ease-in-out both;
        }

        .pulse-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .pulse-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        .pulse-dot:nth-child(3) {
            animation-delay: 0s;
        }

        @keyframes pulse-dot {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner">
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="loading-text">加载中...</div>
        
        <div class="pulse-loader">
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
            <div class="pulse-dot"></div>
        </div>
        <div style="color: #666; font-size: 14px; margin-top: 10px;">脉冲圆点加载动画</div>
    </div>
</body>
</html>
