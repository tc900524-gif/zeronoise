<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>花朵生长动画</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #e0f7fa;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100%;
            height: 100vh;
        }
        
        .flower {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 茎 */
        .stem {
            position: absolute;
            width: 20px;
            height: 0;
            background: linear-gradient(to right, #2e7d32, #4caf50);
            border-radius: 10px;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: growStem 3s forwards;
        }
        
        /* 叶子 */
        .leaf {
            position: absolute;
            width: 40px;
            height: 20px;
            background: #4caf50;
            border-radius: 50% 0 50% 50%;
            top: 60%;
            left: -20px;
            transform: rotate(-20deg);
            animation: growLeaf 2.5s 1s forwards;
        }
        
        /* 花瓣 */
        .petals {
            position: absolute;
            width: 80px;
            height: 80px;
            top: -80px;
            left: -30px;
            animation: bloom 2s 3s forwards;
        }
        
        .petal {
            position: absolute;
            width: 30px;
            height: 50px;
            border-radius: 50% 50% 0 0;
            background: #ff5252;
            transform-origin: bottom center;
        }
        
        .petal:nth-child(1) {
            transform: rotate(0deg);
        }
        
        .petal:nth-child(2) {
            transform: rotate(45deg);
            background: #ff4081;
        }
        
        .petal:nth-child(3) {
            transform: rotate(90deg);
            background: #e040fb;
        }
        
        .petal:nth-child(4) {
            transform: rotate(135deg);
            background: #7c4dff;
        }
        
        .petal:nth-child(5) {
            transform: rotate(180deg);
            background: #536dfe;
        }
        
        .petal:nth-child(6) {
            transform: rotate(225deg);
            background: #448aff;
        }
        
        .petal:nth-child(7) {
            transform: rotate(270deg);
            background: #40c4ff;
        }
        
        .petal:nth-child(8) {
            transform: rotate(315deg);
            background: #18ffff;
        }
        
        /* 花心 */
        .center {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #ffca28;
            border-radius: 50%;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            animation: bloomCenter 1.5s 3.5s forwards;
        }
        
        /* 动画定义 */
        @keyframes growStem {
            from {
                height: 0;
            }
            to {
                height: 200px;
            }
        }
        
        @keyframes growLeaf {
            from {
                width: 0;
                height: 0;
            }
            to {
                width: 40px;
                height: 20px;
            }
        }
        
        @keyframes bloom {
            from {
                transform: scale(0);
            }
            to {
                transform: scale(1);
            }
        }
        
        @keyframes bloomCenter {
            from {
                transform: translateX(-50%) scale(0);
            }
            to {
                transform: translateX(-50%) scale(1);
            }
        }
        
        /* 阳光 */
        .sun {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 60px;
            height: 60px;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 40px #ffeb3b;
            animation: shine 3s infinite alternate;
        }
        
        @keyframes shine {
            from {
                box-shadow: 0 0 40px #ffeb3b;
            }
            to {
                box-shadow: 0 0 60px #ffeb3b, 0 0 80px #ffeb3b;
            }
        }
        
        /* 土壤 */
        .soil {
            position: absolute;
            width: 100%;
            height: 50px;
            background: #795548;
            bottom: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sun"></div>
        <div class="flower">
            <div class="stem">
                <div class="leaf"></div>
            </div>
            <div class="petals">
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
                <div class="petal"></div>
            </div>
            <div class="center"></div>
        </div>
        <div class="soil"></div>
    </div>
</body>
</html>
